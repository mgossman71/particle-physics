services:
  particle-physics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: particle-physics
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
